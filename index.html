
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOVE.exe 💗</title>
<style>
body {
  background: #fff0f6;
  color: #d63384;
  font-family: sans-serif;
  text-align: center;
  padding: 50px 20px;
}
.card {
  background: white;
  padding: 28px 20px;
  border-radius: 25px;
  max-width: 400px;
  margin: auto;
  box-shadow: 0 5px 25px #ffb6d955;
}
button {
  background: #ff85b3;
  color: white;
  border: none;
  border-radius: 20px;
  padding: 13px 22px;
  margin: 8px;
  font-size: 16px;
  cursor: pointer;
}
#message { white-space: pre-line; }
</style>
</head>
<body>
<div class="card">
  <h1>LOVE.exe 💗</h1>
  <p>มีบางอย่างอยากบอกเธอ...</p>
  <div id="message">Are you ready?</div>
  <button onclick="start()">เปิดอ่านข้อความ 💌</button>
  <div id="answer" hidden>
    <h3>กลับมาเป็นแฟนเค้าอีกครั้งได้มั้ย?</h3>
    <button onclick="yes()">ตกลง</button>
    <button onclick="no()">ตกลง</button>
  </div>
</div>
<script>
function start() {
  document.getElementById("message").innerText =
    "เค้ารู้ว่าเราผ่านเรื่องแย่ ๆ มาด้วยกัน...\n" +
    "เค้าไม่อยากเสียเธอไปอีกแล้ว\n" +
    "ครั้งนี้เค้าอยากแก้ไขตัวเองจริง ๆ\n" +
    "และอยากเริ่มต้นใหม่กับเธอ ";
  document.getElementById("answer").hidden = false;
}
function yes() {
  document.getElementById("message").innerText =
    "SYSTEM SUCCESS 💗\n" +
    "แฟนเค้ากลับมาแล้ววว\n" +
    "I LOVE YOU SO MUCH ♡";
  document.getElementById("answer").hidden = true;
}
function no() {
  document.getElementById("message").innerText =
    "SYSTEM SUCCESS 💗\n" +
    "แฟนเค้ากลับมาแล้ววว\n" +
    "I LOVE YOU SO MUCH ♡";
  document.getElementById("answer").hidden = true;
}
</script>
</body>
</html>
