
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOVE.exe 💗</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff2f7;color:#75445c;
font-family:Arial,sans-serif;text-align:center;padding:20px 10px}
h1{margin:8px;font-size:27px}
p{font-size:14px}
#game{width:min(100%,400px);margin:auto}
canvas{width:100%;background:#ffe3ef;border:3px solid #f3a9c8;
border-radius:15px;display:block;touch-action:none}
button{border:0;border-radius:13px;padding:13px 18px;
background:#f4a5c7;color:#702b4c;font-size:17px;
font-weight:bold;margin:5px;touch-action:none}
button:active{background:#e879ad}
#message{font-weight:bold;min-height:42px;padding:8px}
.controls{display:flex;justify-content:center;align-items:center}
.small{font-size:12px;color:#a46b85}
</style>
</head>
<body>
<h1>LOVE.exe 💗</h1>
<p>ผ่านให้ครบ 4 ด่านละกัน ( ＾ω＾ ) </p>
<div id="game">
<canvas id="c" width="360" height="400"></canvas>
<div id="message">พร้อมยัง? อย่าวีนก่อนน้า ฮ่า ๆ</div>
<div class="controls">
<button id="left">◀</button>
<button id="jump">JUMP ↑</button>
<button id="right">▶</button>
</div>
<button id="start">เริ่มเกม / เล่นใหม่</button>
<p class="small">เดินด้วย ◀ ▶ · กระโดดด้วย JUMP · ห้ามด่าเกมนะเพราะเค้าตั้งใจมาก</p>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const msg=document.getElementById('message');
const W=360,H=400;
let level=0,dead=0,active=false,won=false,cam=0;
let keys={left:false,right:false,jump:false};
let p={x:25,y:300,vx:0,vy:0,w:20,h:25,ground:false};
const levels=[
 {name:'ด่าน 1: ก้าวแรกของฟามรัก ≽(˵◝ ⩊ ◜˵ マ≼',len:900,
  plats:[[0,350,210],[260,350,180],[500,350,150],[710,350,190]],
  traps:[[185,330,60],[420,330,60],[640,330,60]],fake:0},
 {name:'ด่าน 2: รักติดไซเรน 📢',len:900,
  plats:[[0,350,240],[290,350,170],[510,350,180],[760,350,140]],
  traps:[[210,330,55],[380,330,50],[550,330,60],[800,330,50]],fake:1},
 {name:'ด่าน 3: ใกล้ละ ๆ',len:950,
  plats:[[0,350,170],[220,315,110],[390,350,120],[570,310,120],[760,350,190]],
  traps:[[145,330,55],[300,295,45],[475,330,40],[650,290,40]],fake:2},
 {name:'ด่าน 4: the end ✨️',len:1000,
  plats:[[0,350,220],[270,320,100],[430,350,130],[620,310,100],[790,350,210]],
  traps:[[195,330,55],[340,300,45],[510,330,45],[690,290,45],[850,330,55]],fake:3}
];
function reset(){
 p={x:25,y:300,vx:0,vy:0,w:20,h:25,ground:false};
 cam=0;active=true;won=false;
 msg.textContent=levels[level].name+' — สู้ ๆ นะ 😈';
}
function die(){
 if(!active)return;
 dead++;reset();
 msg.textContent='ตายอีก ครั้งที่ '+dead;
}
function next(){
 level++;
 if(level>=4){
 active=false;won=true
 msg.textContent='YOU WIN!! 💗 รางวัลของเธอคือ i luv you jupjup^^ ';
 }else reset()
}
function bind(id,k){
 let b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});
 for(let ev of ['pointerup','pointercancel','pointerleave'])
 b.addEventListener(ev,e=>{keys[k]=false});
}
bind('left','left');bind('right','right');bind('jump','jump');
document.getElementById('start').onclick=()=>{
  level=0;
  dead=0;
  reset();
};
reset();
window.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();
 if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
 if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
 if(e.key==='ArrowUp'||e.key===' ')keys.jump=true;
});
window.addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
 if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
 if(e.key==='ArrowUp'||e.key===' ')keys.jump=false;
});
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#75445c';ctx.font='bold 14px Arial';
 ctx.fillText('LEVEL '+(level+1)+'/4',12,22);
 ctx.fillText('💀 '+dead,290,22);
 if(won){
  ctx.font='bold 25px Arial';ctx.fillStyle='#d74d91';
  ctx.fillText('YOU WIN!! 💗',75,165);
  ctx.font='17px Arial';ctx.fillText('l oryh brx',88,205);
  ctx.font='12px Arial';ctx.fillText('ขอบคุณที่เล่นจนจบนะ',100,235);
  requestAnimationFrame(draw);return;
 }
 const L=levels[level];
 let target=Math.max(0,Math.min(L.len-W,p.x-130));
 cam+=(target-cam)*.12;
 // clouds
 ctx.fillStyle='#fff8fc';
 for(let i=0;i<5;i++){
  let x=((i*110-cam*.25)%420+420)%420;
  ctx.beginPath();ctx.arc(x,70+i%2*35,17,0,7);ctx.fill();
 }
 // platforms
 for(let [x,y,w] of L.plats){
  let sx=x-cam;
  if(sx+w<0||sx>W)continue;
  ctx.fillStyle='#e99abd';ctx.fillRect(sx,y,w,H-y);
  ctx.fillStyle='#f8bad4';ctx.fillRect(sx,y,w,7);
 }
 // spikes
 for(let [x,y,w] of L.traps){
  let sx=x-cam;
  if(sx+w<0||sx>W)continue;
  ctx.fillStyle='#d85b8d';
  for(let a=0;a<w;a+=14){
   ctx.beginPath();ctx.moveTo(sx+a,y+20);
   ctx.lineTo(sx+a+7,y);ctx.lineTo(sx+a+14,y+20);ctx.fill();
  }
 }
 // exit
 let ex=L.len-65-cam;
 ctx.fillStyle='#fff';ctx.fillRect(ex,295,36,55);
 ctx.strokeStyle='#d85b8d';ctx.lineWidth=3;ctx.strokeRect(ex,295,36,55);
 ctx.fillStyle='#d85b8d';ctx.font='bold 10px Arial';
 ctx.fillText('EXIT',ex+5,320);
 // player
 let px=p.x-cam;
 ctx.fillStyle='#d74d91';ctx.fillRect(px,p.y,p.w,p.h);
 ctx.fillStyle='#fff';ctx.fillRect(px+4,p.y+6,4,4);
 ctx.fillRect(px+13,p.y+6,4,4);
 ctx.fillStyle='#75445c';ctx.fillRect(px+6,p.y+17,9,2);
 // fake message popups
 if(L.fake===1&&p.x>650&&p.x<730){
  ctx.fillStyle='#fff';ctx.fillRect(65,140,230,65);
  ctx.fillStyle='#d74d91';ctx.font='bold 16px Arial';
  ctx.fillText('เกือบ ๆ จะถึงละ',100,166);
  ctx.font='12px Arial';ctx.fillText('เชื่อเราสิ ไม่มีอะไรหรอก',95,188);
 }
 if(!active){
  ctx.fillStyle='#fff';ctx.fillRect(45,145,270,75);
  ctx.fillStyle='#d74d91';ctx.font='bold 18px Arial';
  ctx.fillText('ว้าย! โดนหลอกกก',105,176);
  ctx.font='13px Arial';ctx.fillText('กดเริ่มเกมแล้วลองใหม่!',105,198);
 }
 requestAnimationFrame(draw);
}
function update(){
 if(active){
  p.vx=(keys.right?2.8:0)-(keys.left?2.8:0);
  p.x=Math.max(0,p.x+p.vx);
  if(keys.jump&&p.ground){p.vy=-9.5;p.ground=false}
  p.vy+=.42;p.y+=p.vy;p.ground=false;
  let L=levels[level];
  for(let [x,y,w] of L.plats){
   if(p.x+p.w>x&&p.x<x+w&&p.y+p.h>=y&&
      p.y+p.h<=y+12&&p.vy>=0){
    p.y=y-p.h;p.vy=0;p.ground=true;
   }
  }
  for(let [x,y,w] of L.traps){
   if(p.x+p.w>x+4&&p.x<x+w-4&&
      p.y+p.h>y+3&&p.y<y+20){die();break}
  }
  // troll tricks
  if(level===0&&p.x>280&&p.x<310&&p.y>250){
   // the gap is real: don't trust the jump
  }
  if(level===1&&p.x>730&&p.x<760&&p.y>240){
   // a suspiciously long jump before the exit
  }
  if(level===2&&p.x>340&&p.x<390&&p.y<290){
   // no extra help here :)
  }
  if(p.y>H+10)die();
  if(p.x>L.len-75){
   if(level===0&&p.x>L.len-80){next()}
   else if(level===1&&p.x>L.len-80){next()}
   else if(level===2&&p.x>L.len-80){next()}
   else if(level===3&&p.x>L.len-80){next()}
  }
 }
 requestAnimationFrame(update);
}
draw();update();
</script>
</body>
</html>
